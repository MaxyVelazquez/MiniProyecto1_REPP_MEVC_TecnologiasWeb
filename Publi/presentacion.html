<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniProyecto1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Styles/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <section id="hero" class="hero header py-4">
        <div class="container-fluid">
            <div class="row justify-content-center text-center">
                <div class="col-12">
                    <img src="/Media/logo.png" alt="jeje" class="img-fluid rounded" style="max-width: 250px;">
                </div>
            </div>
        </div>
    </section>

    <section class="hero py-3" id="formNombre">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-4 col-lg-6 py-5">
                    <div class="p-2 rounded-4 shadow-sm bg-light">
                        <h2 class="text-center">Introduce tu Nombre</h2>
                        <form novalidate id="formularioNombre">
                            <div class="mb-3">
                                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                                <div class="invalid-feedback">No puedes dejar vacio este campo</div>
                            </div>
                            <div class="justify-content-center  text-center mt-3">
                                <button type="submit" class="btn  btncomenzar btn-primary" id="btnComenzar">Comenzar</button>
                            </div>
                            
                        </form>
                    </div>
                    
                    
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container-fluid text-center">
            <p class="mb-1 fw-semibold">
                Creadores: Rey Emmanuel Picazo Perez & Maxy Emiliano Velazquez Cuellar
            </p>
            <p class="mb-0 small">
                MiniProyecto1.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/presentacion.js"></script>
</body>
</html>
