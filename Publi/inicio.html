<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

      <link rel="stylesheet" href="/Styles/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark ticker">
        <div class="casino-lights-border">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>

            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="container">
            <p class="navbar-brand p-4" href="#" id="nameUsuario"></p>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto ">
                    <li class="nav-item" ><a href="#" class="nav-link active navbar-opciones" id="btnInicio">Inicio</a></li>
                    <li class="nav-item"><a href="#" class="nav-link active navbar-opciones" id="btnMisSorteos">Mis Sorteos</a></li>
                    <li class="nav-item"><a href="#" class="nav-link active navbar-opciones" id="btnCerrarSesion">Cerrar Sesión</a></li>
                    
                </ul>
            </div>

        </div>
    </nav>

    <!-- Cards de acciones disponibles -->

    <section class="acciones py-5">
        <div class="container">
            <div class="row g-4 justify-content-center">

                <div class="col-12 col-md-4">
                    <div class="card bg-transparent nombreCard h-100">
                        <div class="card-body d-flex flex-column align-items-center text-center">
                            <h5 class="card-title">Crear Sorteo</h5>
                            <p class="card-text">Comienza a crear tu propio sorteo</p>
                            <div class="card-img-wrapper my-3">
                                <img class="img-fluid" src="/Media/crear.png" alt="Crear">
                            </div>
                            <div class="mt-auto">
                                <button class="btn" id="crear-button">Crear</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="card bg-transparent nombreCard h-100">
                        <div class="card-body d-flex flex-column align-items-center text-center">
                            <h5 class="card-title">Ver Mis Sorteos</h5>
                            <p class="card-text">Revisa o elimina sorteos</p>
                            <div class="card-img-wrapper my-3">
                                <img class="img-fluid" src="/Media/MisSorteos.png" alt="Mis Sorteos">
                            </div>
                            <div class="mt-auto">
                                <button class="btn" id="ver-button">Ver</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="card bg-transparent nombreCard h-100">
                        <div class="card-body d-flex flex-column align-items-center text-center">
                            <h5 class="card-title">Inicia un Sorteo</h5>
                            <p class="card-text">Inicia el sorteo para disfrutar de los regalos</p>
                            <div class="card-img-wrapper my-3">
                                <img class="img-fluid" src="/Media/logo2.png" alt="Sortear">
                            </div>
                            <div class="mt-auto">
                                <button class="btn" id="iniciar-button">Sortear</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>
    <footer class=" text-white py-4 mt-auto">
        <div class="container-fluid text-center">
            <p class="mb-1 fw-semibold">
                Creadores: Rey Emmanuel Picazo Perez & Maxy Emiliano Velazquez Cuellar
            </p>
            <p class="mb-0 small">
                MiniProyecto1.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/inicio.js"></script>
