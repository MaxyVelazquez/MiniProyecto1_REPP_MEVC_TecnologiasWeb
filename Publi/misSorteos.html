<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Sorteos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="/Styles/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <p class="navbar-brand" href="#" id="nameUsuario"></p>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="#" class="nav-link active" id="btnInicio">Inicio</a></li>
                    <li class="nav-item"><a href="#" class="nav-link active" id="btnMisSorteos">Mis Sorteos</a></li>
                    <li class="nav-item"><a href="#" class="nav-link active" id="btnCerrarSesion">Cerrar Sesión</a></li>
                    
                </ul>
            </div>

        </div>
    </nav>

    <section class="sorteos py-5">
            <div class="container">
                <div class="row">
                    <div class="col-md-4 col-sm-12">
                    <div id="cardsSorteos"></div>
                        
                    </div>
                    <button class="btn btn-card m-2" id="btnCrearNuevoSorteo">+</button><!-- LLeva a crear un sorteo desde 0 -->
                </div>
            </div>
        </section>

        <div class="modal fade" id="modalDetalles" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-nombre"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Organizador:</strong> <span id="modal-organizador"></span></p>
                        <p><strong>Evento:</strong> <span id="modal-evento"></span></p>
                        <p><strong>Fecha:</strong> <span id="modal-fecha"></span></p>
                        <p><strong>Presupuesto:</strong> $<span id="modal-presupuesto"></span></p>
                        <p><strong>Participantes:</strong></p>
                        <ul id="modal-participantes"></ul>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/misSorteos.js"></script>
</body>
</html>
